name: Architecture
description: Propose or discuss a structural change, refactor, or design decision
title: "[Architecture]: "
labels: ["architecture"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for design-level topics: module boundaries, shared base classes, data flow between tasks, performance or concurrency models, dependencies, and technical debt. For user-visible functionality use the "New feature" form instead.

  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: What part of the design is causing friction (maintainability, correctness, performance, extensibility)? Reference modules or files where possible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the target design, including how it would be rolled out incrementally.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they were not chosen, including doing nothing.

  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and risks
      description: Effects on existing migrations, config or mapping file formats, output files, and public APIs. Note any breaking changes.

  - type: dropdown
    id: breaking
    attributes:
      label: Breaking change?
      options:
        - "No"
        - "Possibly"
        - "Yes"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I am willing to open a pull request for this
